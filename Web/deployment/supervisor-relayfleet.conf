; 【VPS/専用サーバー向け】root権限があり常駐プロセスを動かせる環境用の設定例。
; Xserver共用レンタルサーバーなど、root権限がなく常駐プロセスを許可しない環境では使えない。
; その場合は deployment/xserver-cron-setup.md のcron方式を使うこと。
;
; vatsim:poll / reservations:release-expired は Schedule::command(...)->everyMinute() として
; routes/console.php に登録済みのため、常駐させるプロセスは「schedule:work」1本だけでよい
; （schedule:workはartisan schedule:runを1分毎に呼び続ける常駐プロセス。個別にvatsim-poller用の
;  常駐プログラムを別途持つ必要はない）。
;
; /etc/supervisor/conf.d/relayfleet.conf などに配置する。

[program:relayfleet-scheduler]
process_name=%(program_name)s
command=php /var/www/relayfleet/artisan schedule:work
directory=/var/www/relayfleet
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/relayfleet/storage/logs/scheduler.log

; QUEUE_CONNECTION=database に戻した場合のみ必要（既定はQUEUE_CONNECTION=syncなので通常は不要）。
[program:relayfleet-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/relayfleet/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
directory=/var/www/relayfleet
autostart=false
autorestart=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/relayfleet/storage/logs/queue-worker.log
